name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      base_version:
        description: '基础版本号（留空则读取 src/app.py 的 APP_VERSION，例如 2.5）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = & .\scripts\ci-version.ps1 -RunNumber $env:GITHUB_RUN_NUMBER -BaseVersion '${{ github.event.inputs.base_version }}'
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Build version: $v"

      - name: 验证版本计算
        shell: pwsh
        run: .\tests\ci-version.ps1

      - name: 打包单文件 exe
        shell: pwsh
        run: .\build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: 自动创建标签并发布 Release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 造价计算工具 v${{ steps.ver.outputs.version }}
          files: 造价计算工具/dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
