name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      base_version:
        description: '基础版本号（留空则读取 src/app.py 的 APP_VERSION，例如 2.5）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = & .\scripts\ci-version.ps1 -BaseVersion '${{ github.event.inputs.base_version }}'
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Build version: $v"

      - name: 验证版本计算
        shell: pwsh
        run: .\tests\ci-version.ps1

      - name: 打包单文件 exe
        shell: pwsh
        run: .\build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: 自动创建标签并发布 Release
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.ver.outputs.tag }}'
          $exe = Get-ChildItem -Path (Join-Path $PWD 'dist') -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'exe not found, nothing to release' }
          $existing = & git ls-remote --tags origin "refs/tags/$tag" 2>$null
          if ($existing) { Write-Host "tag $tag already exists, skip release"; exit 0 }
          $asset = Join-Path $exe.Directory.FullName ("造价计算工具-v${{ steps.ver.outputs.version }}.exe")
          Copy-Item -Path $exe.FullName -Destination $asset -Force
          gh release create $tag $asset `
            --title "造价计算工具 v${{ steps.ver.outputs.version }}" `
            --target '${{ github.sha }}' `
            --generate-notes --latest
          Write-Host "released $tag -> $asset"
